[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-lite"
version = "0.1.0"
description = "Universal Coding Agent Skill and deterministic verification CLI for bounded software changes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ai-sdlc = "ai_sdlc.cli:main"

[tool.setuptools.packages.find]
include = ["ai_sdlc*"]
