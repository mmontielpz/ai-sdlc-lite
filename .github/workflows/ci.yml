name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.9']   # 3.9 stays while pyproject.toml claims it
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Ensure wheel build prerequisites
        run: python -m pip install --quiet setuptools
      - name: Deterministic suite and explicit skip policy
        run: |
          python -B - <<'PY'
          import collections
          import os
          import pathlib
          import shutil
          import unittest

          # No native-agent installation/authentication or inference in this job.
          if shutil.which('copilot') or os.environ.get('UPDATE_GOLDEN'):
              raise SystemExit('Copilot must be absent and UPDATE_GOLDEN unset')
          expected_skips = {
              'test_install_skill.InstallerTests.test_native_cli_discovery_and_rollback',
              'test_install_skill.InstallerTests.test_native_cli_recognizes_isolated_sandbox_settings',
          }
          # Deleting or renaming a test module must be a reviewed change to this list.
          # New modules need not be listed; they are reported below and must still pass.
          expected_modules = {
              'test_adapter_contract', 'test_cli', 'test_codex_adapter', 'test_controlled_autonomy',
              'test_delivery', 'test_delivery_execute_cli', 'test_delivery_executor',
              'test_delivery_native_integration', 'test_delivery_recover_cli', 'test_delivery_reporting',
              'test_distribution', 'test_experience_cli', 'test_experience_events',
              'test_experience_journal', 'test_experience_record', 'test_experience_record_verify',
              'test_first_five_minutes', 'test_godot_adapter', 'test_init', 'test_init_claude_target',
              'test_init_journal', 'test_init_task_targets', 'test_install_skill',
              'test_installer_recovery', 'test_micro_cycles', 'test_native_git', 'test_result_template',
              'test_verify_contract', 'test_verify_foundation', 'test_verify_scope', 'test_verify_summary',
          }

          def walk(items):
              for item in items:
                  if isinstance(item, unittest.TestSuite):
                      yield from walk(item)
                  else:
                      yield item

          suite = unittest.defaultTestLoader.discover('tests')
          cases = list(walk(suite))
          if not cases:
              raise SystemExit('No tests discovered')
          counts = collections.Counter(case.id().split('.')[0] for case in cases)
          missing = sorted(expected_modules - set(counts))
          if missing:
              raise SystemExit('Expected test modules contributing no tests: ' + ', '.join(missing))
          on_disk = {path.stem for path in pathlib.Path('tests').glob('test_*.py')}
          silent = sorted(on_disk - set(counts))
          if silent:
              raise SystemExit('Test modules on disk contributing no tests: ' + ', '.join(silent))
          extra = sorted(set(counts) - expected_modules)
          if extra:
              print('NOTICE: modules not in expected_modules (consider adding): ' + ', '.join(extra))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          skipped = {test.id() for test, reason in result.skipped}
          problems = []
          if not result.wasSuccessful():
              problems.append('failures, errors or unexpected successes')
          if result.testsRun != len(cases):
              problems.append('ran %d of %d discovered tests' % (result.testsRun, len(cases)))
          if result.expectedFailures:
              problems.append('expected failures are not allowed')
          if skipped != expected_skips:
              problems.append('unexpected skip set: %s' % sorted(skipped ^ expected_skips))
          print('Discovered=%d Run=%d Skipped=%d Modules=%d' % (len(cases), result.testsRun, len(skipped), len(counts)))
          print('Native runtime qualification: NOT_RUN')
          if problems:
              raise SystemExit('; '.join(problems))
          PY
      - name: Stock Ubuntu 24.04 wheel build is reproducible
        if: matrix.python == '3.14'
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq git python3-pip python3-venv python3-setuptools python3-wheel >/dev/null
              git config --global --add safe.directory "*"
              umask 022
              for n in 1 2; do
                git clone -q --no-hardlinks /src /w$n && cd /w$n
                SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python3 -m pip wheel -q --no-build-isolation --no-deps -w /d$n .
                cd /
              done
              cmp /d1/*.whl /d2/*.whl && sha256sum /d1/*.whl
              python3 -m venv /v && /v/bin/pip install -q --no-index --no-deps /d1/*.whl && /v/bin/ai-sdlc --version
            '
      - name: Codex declaration validator (runtime NOT_RUN)
        run: >-
          python -B adapters/agents/codex/validate_adapter.py
          --config adapters/agents/codex/examples/declaration.json --project .
      - name: Godot declaration validator (runtime NOT_RUN)
        run: >-
          python -B adapters/godot/validate_adapter.py
          --config adapters/godot/examples/disposable-sample/godot-adapter.json
          --project adapters/godot/examples/disposable-sample
      - name: Whitespace across event change range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Preserve checkout and golden fixtures
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  website:
    name: website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The job always runs, so the required gate always gets a result. Node work happens only when the site or a
      # file it reads or links to changed. An unknown base runs everything; a failing diff fails the job.
      - name: Detect website-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          relevant=true
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            changed=$(git diff --name-only --no-renames "$BASE_SHA" HEAD)
            if ! grep -qE '^(website/|docs/|examples/|scripts/verify_scope\.py$|[^/]+\.md$|LICENSE$|pyproject\.toml$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
              relevant=false
            fi
          fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version-file: website/.nvmrc
          package-manager-cache: false
      - name: Locked install
        if: steps.changes.outputs.relevant == 'true'
        working-directory: website
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Build, links, claims, HTML, accessibility and responsive checks
        if: steps.changes.outputs.relevant == 'true'
        working-directory: website
        run: npm run check

  ci-gate:
    name: ci-gate
    if: always()
    needs: [deterministic, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    env:
      TESTS: ${{ needs.deterministic.result }}
      WEBSITE: ${{ needs.website.result }}
    steps:
      - name: Single stable required check
        run: test "$TESTS" = success && test "$WEBSITE" = success
